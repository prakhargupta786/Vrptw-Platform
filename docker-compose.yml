services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: vrptw, POSTGRES_PASSWORD: vrptw, POSTGRES_DB: vrptw }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://vrptw:vrptw@db:5432/vrptw
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: [./backend/storage:/app/storage]
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -l info --concurrency=1
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://vrptw:vrptw@db:5432/vrptw
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    volumes: [./backend/storage:/app/storage]
volumes:
  pgdata:
